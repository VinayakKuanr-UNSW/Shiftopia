name: CI & Deploy

# Single gated pipeline:
#   verify           → type-check + unit tests + build (runs on every push & PR)
#   python-tests     → pytest for optimizer-service/ and ml/ (HTTP-level API
#                      tests via FastAPI TestClient + solver regressions). Not a
#                      gate on deploy: neither service ships through this
#                      pipeline (see AGENTS.md §3).
#   rls-audit        → RLS regression guard against the Supabase dev database
#   api-integration  → HTTP + SQL access suites on a throwaway Supabase built
#                      from supabase/migrations + supabase/seeds
#   deploy           → runs ONLY if verify, rls-audit and api-integration pass.
#                      main push → production, PR → preview (URL auto-commented).
#                      A red build never ships.
#
# Activation: the deploy job is guarded on the VERCEL_TOKEN secret. Until that
# secret exists it skips cleanly (green) so the pipeline is safe to land before
# the token is in place. Vercel's own Git auto-deploy stays ON until cutover.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual run on any branch, for stacked PRs whose base is not main and so
  # never trigger the two events above. Verification only: deploy skips it.
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  verify:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      # Lint now RUNS (the eslint 9 / typescript-eslint crash was fixed by the
      # 8.64 bump). It is non-blocking for now: ~2,600 pre-existing violations
      # (mostly module-boundary deep imports) must be burned down before this
      # can gate the build. Flip `continue-on-error` to false once at zero.
      - name: Lint (non-blocking — tech-debt ratchet)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Source-map upload is skipped automatically when these are unset
          # (e.g. on PRs from forks). Add them as repo secrets for prod builds.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

  # The Python services' suites (the CP-SAT solver's regressions and the ML
  # service). Python versions match each service's Dockerfile.
  python-tests:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python versions match each service's Dockerfile base image.
          - service: optimizer-service
            python: '3.12'
            requirements: requirements.txt
          - service: ml
            python: '3.13'
            requirements: requirements-dev.txt
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: ${{ matrix.service }}/${{ matrix.requirements }}

      - name: Install dependencies
        run: python -m pip install -r ${{ matrix.requirements }}

      # Both conftests default the service's auth bypass on; the auth tests
      # switch it off per test. Nothing here talks to a real database.
      - name: pytest
        run: python -m pytest -q

  rls-audit:
    name: RLS regression guard
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Guard — require SUPABASE_DB_URL
        id: guard
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret not set — skipping RLS guard. Add it to activate."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.ok == 'true'

      # psql ships on the ubuntu-latest runner image (postgresql-client).
      - name: Run RLS guard (fails on always-true / definer-view regression)
        if: steps.guard.outputs.ok == 'true'
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/rls_guard.sql

  # API integration tests: real HTTP (PostgREST, RPCs, edge functions) against a
  # throwaway local Supabase built from supabase/migrations + supabase/seeds —
  # the same database production runs (docs/operations/database-baseline.md).
  # Proves the access matrix over HTTP and pins what the anon key can reach.
  # Nothing here touches the Supabase project. Database and edge-function
  # changes ship through the MCP (Supabase is the source of truth; the drift
  # check proves the repo matches it), but the app deploys only when this
  # suite is green: the frontend relies on the access rules it pins.
  api-integration:
    name: API integration (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check integration tests
        run: npm run type-check:integration

      - name: Start local Supabase (migrations + seeds + edge runtime)
        # Pull from GHCR, not the CLI's default public.ecr.aws: ECR's anonymous
        # quota is per runner IP and refuses shared runners ("Data limit exceeded").
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: npx supabase start -x studio,imgproxy,mailpit,logflare,vector,postgres-meta,supavisor,realtime

      - name: API integration tests
        run: npm run test:integration

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  deploy:
    name: Deploy (Vercel)
    needs: [verify, rls-audit, api-integration]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Guard — require VERCEL_TOKEN
        id: guard
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret not set — skipping deploy. Add it to activate the gated pipeline."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve target (production on main push, else preview)
        if: steps.guard.outputs.ok == 'true'
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.ok == 'true'

      - uses: actions/setup-node@v5
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: '20'

      # Pinned: an unannounced CLI change is how the build lost its env (below).
      - name: Install Vercel CLI
        if: steps.guard.outputs.ok == 'true'
        run: npm i -g vercel@65.8.0

      # Vercel builds the source itself. The project's VITE_* variables are
      # Sensitive, and `vercel pull` cannot read Sensitive values: it writes
      # "[SENSITIVE]" placeholders, so a runner-side `vercel build` baked
      # VITE_SUPABASE_URL="[SENSITIVE]" into the bundle and production failed
      # to start ("Invalid supabaseUrl"). The gate is unchanged: this job still
      # runs only after verify, rls-audit and api-integration pass.
      - name: Deploy
        if: steps.guard.outputs.ok == 'true'
        id: deploy
        run: |
          url=$(vercel deploy ${{ steps.target.outputs.flag }} --yes --token="$VERCEL_TOKEN" | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ steps.target.outputs.env }}: $url"
          echo "### 🚀 Deployed (${{ steps.target.outputs.env }})" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: steps.guard.outputs.ok == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n🔍 **Preview deployed:** ${url}\n\n_Updated for ${context.sha.slice(0,7)}_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
